replicaCount: 1

image:
  repository: cryptotax/ledger-svc
  tag: dev
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8086
  targetPort: 8086

strategy:
  maxUnavailable: 0
  maxSurge: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  enabled: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probes:
  startup:
    path: /health
    periodSeconds: 5
    failureThreshold: 30
    timeoutSeconds: 2
  readiness:
    path: /health
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 2
  liveness:
    path: /health
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 2

env:
  - name: APP_ADDR
    value: "0.0.0.0:8086"
  - name: RUST_LOG
    value: "info,sqlx=warn"

secrets:
  enabled: true
  name: ledger-svc-secrets

externalSecret:
  enabled: true
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  remoteKey: cryptotax/ledger-svc
  data:
    - secretKey: DATABASE_URL
      property: DATABASE_URL
    - secretKey: DB_MAX_CONNS
      property: DB_MAX_CONNS
    - secretKey: DB_CONN_TIMEOUT
      property: DB_CONN_TIMEOUT

configYaml: |-
  exchange_cfg_paths:
    mexc: "src/application/exchanges/configs/mexc.yaml"
    okx: "src/application/exchanges/configs/mexc.yaml"

workerConfigYaml: |-
  rabbitmq_publisher:
    host: host.docker.internal
    port: 5672
    user: guest
    password: guest
    exchange: cryptotax
    routing_key: import.completed
    reconnect_attempts: 100
    reconnect_timeout_ms: 5000

  outbox_worker:
    batch_size: 10
    max_attempts: 10
    poll_interval: 5
